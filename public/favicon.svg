<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Two candlesticks on nothing, in the page's own colours: the green one
       is up, high, and the red one down, dropping below it. Bold wicks and
       bodies, so the pair survives 16 pixels; a currency mark would not. -->
  <g stroke-linecap="round" stroke-width="6">
    <path d="M16 4v10M16 40v10" stroke="#2bd99f"/>
    <path d="M48 14v8M48 52v10" stroke="#ff4d6d"/>
  </g>
  <rect x="5" y="14" width="22" height="26" rx="3.5" fill="#2bd99f"/>
  <rect x="37" y="22" width="22" height="30" rx="3.5" fill="#ff4d6d"/>
</svg>
