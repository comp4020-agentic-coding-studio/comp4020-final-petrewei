<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Losscut! The log</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
  <script type="module">import(`/log.js${location.search}`);</script>
</head>
<body class="log">
  <header>
    <h1>The log <span class="jp">operator only</span></h1>
    <p class="tag">Who did what, from the server's activity log. Each trader is a short code and the name the room sees.</p>
    <a href="/">Back to the market</a>
  </header>
  <main class="logpage">
    <section class="win">
      <div class="bar"><span class="file">activity.log</span><span id="summary"></span></div>
      <ol id="log"></ol>
    </section>
  </main>
</body>
</html>
