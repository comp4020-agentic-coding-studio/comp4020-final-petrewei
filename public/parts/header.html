  <header class="top">
    <a class="brand" href="{{home}}" aria-label="{{logo}}">
      <span class="logo" data-t="logo">{{logo}}</span>
      <span class="sub" data-t="sub">{{sub}}</span>
    </a>
{{tabs}}
    <div class="end">
{{whoami}}
    <div class="tools">
{{feats}}
      <label class="lang" data-tip="lang">
        <span class="sr-only">Language</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <select id="lang" aria-label="Language">
          <option value="en" lang="en">English</option>
          <option value="ja" lang="ja">日本語</option>
          <option value="zh" lang="zh-CN">简体中文</option>
        </select>
      </label>
      <!-- Optional music: off until a player turns it on; the track loads
           only then (ADR 0020). -->
      <button id="music" class="icon music" type="button" aria-pressed="false" data-tip="musicOn" data-t-aria="musicOn">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M9 17.5V5.5l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.5" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.5" fill="currentColor"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <audio id="bgm" src="/audio/bgm.m4a" preload="none" loop></audio>
      <button id="theme" class="icon" type="button" data-tip="toLight">
        <svg class="sun" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
        <svg class="moon" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>
      </button>
      <a class="icon about" href="{{about}}" data-tip="about" data-t-aria="about">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/></svg>
      </a>
    </div>
    </div>
  </header>
