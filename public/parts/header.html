  <header class="top">
    <a class="brand" href="{{home}}" aria-label="{{logo}}">
      <span class="logo" data-t="logo">{{logo}}</span>
      <span class="sub" data-t="sub">{{sub}}</span>
    </a>
{{tabs}}
    <div class="end">
{{whoami}}
    <div class="tools">
{{feats}}
      <label class="lang" data-tip="lang">
        <span class="sr-only">Language</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <select id="lang" aria-label="Language">
          <option value="en" lang="en">English</option>
          <option value="ja" lang="ja">日本語</option>
          <option value="zh" lang="zh-CN">简体中文</option>
        </select>
      </label>
{{sound}}
      <a class="icon about" href="{{about}}" data-tip="about" data-t-aria="about">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/></svg>
      </a>
    </div>
    </div>
  </header>
